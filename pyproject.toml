[project]
name = "miner"
version = "0.1.0"
description = "CLI que identifica repositorios de GitHub que usan GitHub Agentic Workflows (GH-AW)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "pandas>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Dependencias solo para los notebooks de eda/ (no son necesarias para la CLI).
# tornado<6.5: jupyter_server 2.21.0 rompe con tornado>=6.5 (FileFindHandler
# no tiene 'allowed_symlink_directory'), causando 500 en todos los assets
# estáticos de JupyterLab (pantalla en blanco).
eda = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tornado<6.5",
]

[project.scripts]
miner = "miner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miner"]
